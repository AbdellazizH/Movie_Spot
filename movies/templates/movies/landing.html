{% extends 'base.html' %}

{% block title %}
  Landing page
{% endblock %}

{% block content %}
  <div class="container mt-4">
    <form method="get" action="{% url 'landing_page' %}">
      <select class="btn btn-primary" name="category" id="" onchange="this.form.submit()">
        <option value="popular" {% if category == 'popular' %} selected {% endif %} >Popular</option>
        <option value="now_playing" {% if category == 'now_playing' %} selected {% endif %}>Now Playing</option>
        <option value="top_rated" {% if category == 'top_rated' %} selected {% endif %}>Top Rated</option>
        <option value="upcoming" {% if category == 'upcoming' %} selected {% endif %}>Upcoming</option>
      </select>
    </form>

    <form method="get" action="{% url 'landing_page' %}" method="post" class="input-group w-50 mt-2">
      {% csrf_token %}
      <input name="search" type="text" class="form-control" placeholder="search for movies...">
      <div class="input-group-append">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    {% if error_message %}
    	<p>{{ error_message }}</p>
    {% endif %} 

    <div id="movie-container" class="row mt-4">
        {% for movie in movies %}
          <div class="col-md">
            <a href="#" class="text-decoration-none">
                <div class="card" style="width: 18rem;">
                  <img src="https://image.tmdb.org/t/p/original/{{ movie.poster_path }}" class="card-img-top" alt="...">
                  <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text">{{ movie.vote_average|floatformat:1 }} / 10</p>
                  </div>
                </div>
            </a>
          </div>
        {% endfor %}
    </div>
  </div>

{% endblock %}
